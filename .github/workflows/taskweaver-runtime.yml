name: TaskWeaver runtime

on:
  push:
    branches: [main, refactor/z-runtime-integration]
  pull_request:
  workflow_dispatch:

jobs:
  resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Headless CLI fixture smoke
        run: node scripts/taskweaver-headless.mjs --fixture --text "CI fixture" --json-summary
      - run: node scripts/test-z-runtime-resolution.mjs

  smoke-macos:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build Z runtime deploy
        env:
          CI: 'true'
        run: pnpm run build:z-runtime
      - run: node scripts/test-z-host.mjs
      - run: pnpm run test:models
