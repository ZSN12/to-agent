name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  ui-verify:
    name: TaskWeaver UI verification
    runs-on: macos-14
    timeout-minutes: 35
    env:
      TASKWEAVER_UI_ARTIFACTS: artifacts/ui-verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium headless shell
        run: pnpm --dir packages/runtime/interaction/ui-verify exec playwright-core install --only-shell chromium
      - name: Run isolated shell UI scenarios
        run: pnpm run test:ui
      - name: Upload UI failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskweaver-ui-verify
          path: |
            artifacts/ui-verify/**/*.png
            artifacts/ui-verify/**/*.zip
            artifacts/ui-verify/**/failure.json
            artifacts/ui-verify/**/aria-snapshot.yml
            artifacts/ui-verify/driver-failure.json
          if-no-files-found: ignore

  test:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build retained Host packages for runtime tests
        run: pnpm run build:host
      - name: Typecheck
        run: pnpm run typecheck:node
      - name: Check IPC contract and renderer types
        run: pnpm run check:ipc
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:all
      - name: Parity report fixture checks
        run: pnpm run test:parity-bench

  dsh-unit:
    name: DSH unit shard ${{ matrix.shard }}/4
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run retained DSH unit shard
        env:
          DSH_VITEST_SHARD: ${{ matrix.shard }}/4
        run: pnpm run test:dsh-unit:shard

  dsh-e2e:
    name: DSH keyless and runtime E2E
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Build retained Host packages for artifact E2E
        env:
          CI: 'true'
        run: pnpm run build:host
      - name: Build deployed TaskWeaver runtime
        env:
          CI: 'true'
        run: pnpm run build:z-runtime
      - name: Check deployed Host, preset integrity, and composition
        run: pnpm run test:runtime-deploy
      - name: Run configured DSH E2E cases (provider-gated cases skip without credentials)
        run: pnpm run test:dsh-e2e
      - name: Run complete mock-provider Host deployment suite
        run: pnpm run test:z-host-deploy
