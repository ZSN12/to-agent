name: Nightly package smoke

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  macos-package:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Check IPC, lint, Node typecheck, and security
        run: |
          pnpm run check:ipc
          pnpm run lint
          pnpm run typecheck:node
          pnpm run test:security-hardening
          pnpm run test:chat-images
      - name: Build deployable runtime
        env:
          CI: 'true'
        run: pnpm run build:z-runtime
      - name: Check deployed Host, preset integrity, and composition
        run: pnpm run test:runtime-deploy
      - name: Build and smoke-test macOS app package
        env:
          CI: 'true'
        run: |
          pnpm run app:builder
