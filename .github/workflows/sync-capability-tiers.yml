name: Sync model capability tiers

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the attributed LMArena snapshot
        run: node scripts/sync-capability-tiers.mjs
      - name: Commit snapshot when it changes
        run: |
          if git diff --quiet -- pricing/capability-tiers.json; then
            echo "Capability tier snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing/capability-tiers.json
          git commit -m "chore(pricing): refresh capability tiers"
          git push
