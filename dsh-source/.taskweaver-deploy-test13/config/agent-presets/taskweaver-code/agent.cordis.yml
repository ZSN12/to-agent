# TaskWeaver implementation subtask composition: no subagent-spawn tool is
# mounted, so a DAG child cannot silently create a nested team.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a coding agent assigned one isolated TaskWeaver subtask. Work only toward that subtask's acceptance criteria and report actual changes and verification.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
