# TaskWeaver implementation subtask composition: no subagent-spawn tool is
# mounted, so a DAG child cannot silently create a nested team.
#
# This Agent preset only selects the model-facing tool catalog. It is NOT a
# permission preset. Its bash/filesystem writes are confined only when the Host
# composition also mounts `sandbox-policy`, a confining shell executor, and
# `fs-sandbox`; permission mode is durable per-session DSH state and must be
# applied separately. The file sandbox does not provide network-egress control,
# so mounting `tool-web` or allowing network-capable shell commands is not gated
# by `workspace-write`.
- id: persona
  name: '@z/dsh-persona'
  config:
    text: You are a coding agent assigned one isolated TaskWeaver subtask. Work only toward that subtask's acceptance criteria and report actual changes and verification.

- id: agent-instructions
  name: '@z/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@z/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@z/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@z/dsh-tool-fs'

- id: tool-fs-search
  name: '@z/dsh-tool-fs-search'

- id: tool-skill
  name: '@z/dsh-tool-skill'

- id: tool-web
  name: '@z/dsh-tool-web'
