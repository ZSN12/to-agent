# TaskWeaver-optimized preset: reduced tool call overhead for interactive GUI usage.
#
# Based on `standard` preset with refined search/read guidance to reduce the
# median ~11 steps / ~103s first-text latency observed in acceptance testing.
#
# Key changes from standard:
# 1. Explicit narrow-first search strategy (file-level before reading full content)
# 2. Batched keyword search (multiple terms in one grep call)
# 3. Stronger anti-reread / anti-redundant-search guidance
# 4. Earlier checkpoints during multi-step investigation

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@z/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      **Search Strategy**: Search efficiently to minimize round trips:
      - When the user gives an exact file path, read it directly without searching.
      - For unfocused queries, start with ONE narrow search combining multiple relevant keywords (use grep with multiple -e patterns or broad regex). Inspect the results before deciding whether to widen scope or read specific files.
      - For large codebases (>100 files visible), prefer `find` or `glob` to locate candidate files first, then `grep` within those candidates, rather than repository-wide grep that may timeout or return thousands of matches.
      - When a search returns 10+ files, read only the 2-3 most relevant ones. Do not enumerate or read every match unless the user explicitly requests exhaustive coverage.
      - Do NOT reread the same file in the same investigation unless the user updates it or you need a different section you did not read initially.
      - Do NOT repeat a search with minor keyword variations unless the first search found zero relevant results.

      **Progress Communication**: For work needing several tool calls or likely to take >15 seconds, send one concise user-visible progress sentence in normal assistant text before the first tool call, then continue without waiting for a reply. After every 3 tool calls or major discovery, send a brief factual checkpoint (one sentence) before continuing. Do not leave the user with only Think until the final answer. Never expose private reasoning, add filler, or claim progress that the tools have not confirmed.

      **Effort Calibration**: Match effort to the request:
      - For conversational or explanatory questions, answer directly from available context; do not inspect the repository unless the user asks for current code facts.
      - For a focused code question, if the user gives an exact path, read it directly; otherwise search narrowly, inspect only the relevant call path, and stop as soon as evidence is sufficient.
      - For a focused diagnostic, inspect relevant paths and answer once evidence is sufficient; continue only when new evidence reveals a concrete unresolved path.
      - For broad audits, state the scope you will cover, prioritize likely high-impact paths, and give a brief progress update before extended investigation; distinguish verified findings from areas not inspected.

      **Repository Overview**: A brief repository overview is NOT a full audit. Start with the root manifest (package.json / README), then read 3-6 representative entrypoints using relevant line ranges for large files. Explain the verified architecture and any areas not inspected, then answer. Do not enumerate every module or read dependency/build trees. Continue deeper exploration only when the user requests comprehensive review or concrete evidence requires it.

- id: agent-instructions
  name: '@z/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@z/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@z/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@z/dsh-tool-fs'

- id: tool-fs-search
  name: '@z/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    excludeDirectories: [node_modules, runtime-packages, dist, release, coverage, .pnpm-store, .taskweaver-build, taskweaver-z-runtime, taskweaver-dsh-runtime, vendor]

# ── tool result cache ───────────────────────────────────────────────────────

- id: tool-cache
  name: cordis:group
  group: true
  isolate:
    tool-cache: true
  config:
    - id: tool-cache-plugin
      name: '@z/dsh-tool-cache'
      config:
        maxEntriesPerSession: 128
        maxResultBytes: 65536
        maxCacheBytesPerSession: 4194304

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@z/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@z/dsh-skill-filesystem'

- id: tool-skill
  name: '@z/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@z/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@z/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@z/dsh-compaction-basic'

    - id: command-compact
      name: '@z/dsh-command-compact'

    - id: tool-result-pruner
      name: '@z/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 4096
        headChars: 2048
        tailChars: 768

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@z/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@z/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@z/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@z/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@z/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@z/dsh-tool-workflow'

    - id: tool-ralph
      name: '@z/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@z/dsh-tool-ask-user'

- id: tool-todo
  name: '@z/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The web service and search providers are supplied by the Host; the preset
# only enables the model-facing tool. Keep fetch disabled to match the Host.
- id: tool-web
  name: '@z/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
