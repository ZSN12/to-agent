# Add the persisted goal domain and its model-facing tools to the real one-shot app.
- id: base
  name: '@z/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@z/dsh-goal'
          - id: tool-goal
            name: '@z/dsh-tool-goal'
