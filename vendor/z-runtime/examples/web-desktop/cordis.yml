# Opt-in Web overlay that adds macOS desktop control to the GUI profile.
# Apply with `dsh web --patch examples/web-desktop/cordis.yml`. The base profile
# already mounts the `approval` (dsh-user-approval) and `shell` (bash) seams the
# desktop tools inject, so this overlay only inserts the desktop tool plugin.
# The port pin keeps this demo off the default 3080 and web-cordis's 3081.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082

# Access is scoped by macOS bundle id: the frontmost app is matched against
# `policy.rules`; an unmatched app falls back to `default`. Here `default: deny`
# defers unmatched apps to the interactive `approval/request` waterfall (the
# base profile answers `ask` via the GUI), so only the listed apps run directly.
- insert:
    - id: tool-desktop
      name: '@z/dsh-tool-desktop'
      config:
        policy:
          rules:
            - bundleId: com.apple.Safari
              access: allow
            - bundleId: com.apple.Terminal
              access: allow
          default: deny
        gateAllow: false
        persistApproval: false
        moveDurationMs: 400
