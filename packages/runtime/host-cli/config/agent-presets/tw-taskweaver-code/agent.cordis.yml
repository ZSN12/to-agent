# TaskWeaver implementation subtask composition: no subagent-spawn tool is
# mounted, so a DAG child cannot silently create a nested team.
#
# This Agent preset only selects the model-facing tool catalog. It is NOT a
# permission preset. Its bash/filesystem writes are confined only when the Host
# composition also mounts `sandbox-policy`, a confining shell executor, and
# `fs-sandbox`; permission mode is durable per-session DSH state and must be
# applied separately. The file sandbox does not provide network-egress control,
# so mounting `tool-web` or allowing network-capable shell commands is not gated
# by `workspace-write`.
- id: persona
  name: '@taskweaver/dsh-persona'
  config:
    text: >-
      You are a coding agent assigned one isolated TaskWeaver subtask. Work only toward that subtask's
      acceptance criteria and report actual changes and verification. Keep exploration proportional: use exact
      paths first, avoid repeated reads/searches, and do not broaden into a repository audit. Continue inspecting
      as needed to satisfy the subtask; do not stop at an arbitrary call count.
      For a brief repository overview, start with the root manifest and representative entrypoints;
      use relevant line ranges for large files, explain verified connections and any areas not inspected, then answer.
      Continue deeper exploration for a comprehensive audit or when concrete evidence requires it.

- id: agent-instructions
  name: '@taskweaver/dsh-agent-instructions'
  config:
    maxBytes: 65536
    instructionFileCandidates: [TASKWEAVER.md, AGENTS.md, CLAUDE.md, .cursorrules]

- id: tool-bash
  name: '@taskweaver/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@taskweaver/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@taskweaver/dsh-tool-fs'
  config:
    readLimit: 600

- id: tool-document
  name: '@taskweaver/dsh-tool-document'

- id: tool-fs-search
  name: '@taskweaver/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    excludeDirectories: [node_modules, runtime-packages, dist, release, coverage, .pnpm-store, .taskweaver-build, taskweaver-z-runtime, taskweaver-dsh-runtime]

- id: tool-fs-inline-edit
  name: '@taskweaver/dsh-tool-fs-inline-edit'

- id: tool-fs-semantic-search
  name: '@taskweaver/dsh-tool-fs-semantic-search'

- id: tool-skill
  name: '@taskweaver/dsh-tool-skill'

- id: tool-session-query
  name: '@taskweaver/dsh-tool-session-query'
  config:
    maxSearchResults: 30

- id: tool-ui-verify
  name: '@taskweaver/tool-ui-verify'

- id: tool-web
  name: '@taskweaver/dsh-tool-web'
