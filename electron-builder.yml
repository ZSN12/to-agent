appId: com.taskweaver.desktop
productName: TaskWeaver
copyright: Copyright © 2026 TaskWeaver

directories:
  output: release
  buildResources: build

electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - electron/**/*
  - pricing/**/*
  - registry/**/*
  - runtime-lock.json
  - package.json
  - "!src/**"
  - "!scripts/**"
  - "!release/**"
  - "!*.md"

extraResources:
  # scripts/build-z-runtime.mjs → runtime-packages (electron-builder strips node_modules)
  - from: vendor/taskweaver-z-runtime
    to: taskweaver-z-runtime
    filter:
      - "lib/**/*"
      - "config/**/*"
      - "runtime-packages/**/*"
      - "package.json"
      - "taskweaver-z-client/**/*"
      - "taskweaver-dsh-client/**/*"
      - "taskweaver-runtime-meta.json"
      - "!runtime-packages/.cache/**/*"

compression: store
npmRebuild: false
buildDependenciesFromSource: false

asar: true
asarUnpack:
  - electron/preload.cjs
  - electron/backend/pty-shim.py
  - node_modules/node-pty/**/*
  - node_modules/@bitkyc08/opencodex/**/*

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dir
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: TaskWeaver ${version}

extraMetadata:
  main: electron/main.cjs
