appId: com.taskweaver.desktop
productName: TaskWeaver
copyright: Copyright © 2026 TaskWeaver

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - pricing/**/*
  - package.json
  - packages/pi/packages/coding-agent/dist/**/*
  - packages/pi/packages/coding-agent/node_modules/**/*
  - "!src/**"
  - "!scripts/**"
  - "!release/**"
  - "!*.md"

compression: store
npmRebuild: false
buildDependenciesFromSource: false

asar: true
asarUnpack:
  - electron/preload.cjs
  - packages/pi/packages/coding-agent/node_modules/@earendil-works/**/*
  - packages/pi/packages/coding-agent/node_modules/@silvia-odwyer/**/*

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dir
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: TaskWeaver ${version}

extraMetadata:
  main: electron/main.cjs
